<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Shadow Horror</title>

<style>

/* บังคับแนวนอน */
@media (orientation:portrait){
body::before{
content:"กรุณาหมุนจอเป็นแนวนอน";
position:fixed;
top:0;left:0;
width:100%;
height:100%;
background:black;
color:white;
display:flex;
justify-content:center;
align-items:center;
font-size:24px;
z-index:9999;
}
}

body{
margin:0;
background:black;
font-family:Arial;
color:white;
text-align:center;
overflow:hidden;
}

button{
padding:10px 20px;
border:none;
border-radius:8px;
background:#ffcc00;
font-size:16px;
margin:5px;
}

#menu,#game,#setting{
display:none;
padding:15px;
}

/* Map */
#map{
width:90vw;
max-width:900px;
height:60vh;
background:#111;
margin:auto;
border:2px solid #555;
position:relative;
overflow:hidden;
}

/* Player */
#player{
width:40px;
height:40px;
background:#00ffcc;
position:absolute;
border-radius:6px;
}

/* Ghost */
.ghost{
width:40px;
height:40px;
background:red;
border-radius:50%;
position:absolute;
}

/* Item */
.item{
width:25px;
height:25px;
background:yellow;
position:absolute;
border-radius:4px;
}

/* HUD */
#hud{
display:flex;
justify-content:space-around;
margin:8px;
font-size:18px;
}

input[type=range]{
width:200px;
}

</style>
</head>

<body>

<!-- MENU -->
<div id="menu">

<h1>👻 Shadow Horror</h1>
<p>เกมผีโรงเรียน</p>

<button onclick="start()">เริ่มเล่น</button><br>
<button onclick="openSetting()">ตั้งค่า</button>

</div>

<!-- SETTING -->
<div id="setting">

<h2>⚙️ ตั้งค่า</h2>

<p>เสียงเพลง</p>
<input type="range" min="0" max="100" value="50" id="musicVol">

<p>เสียงเอฟเฟกต์</p>
<input type="range" min="0" max="100" value="50" id="sfxVol">

<p>กราฟิก</p>
<select id="graphic">
